plugins {
    id 'com.android.application'
}

android {
    namespace 'it.motorlab.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.motorlab.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-unified-LAB'
    }

    signingConfigs {
        lab {
            storeFile file(System.getenv('MOTORLAB_LAB_KEYSTORE') ?: 'missing-test-only-keystore.jks')
            storePassword System.getenv('MOTORLAB_LAB_PASSWORD') ?: 'disabled'
            keyAlias 'motorlab-lab'
            keyPassword System.getenv('MOTORLAB_LAB_PASSWORD') ?: 'disabled'
        }
        // Canonical MotorLab must NEVER use the disposable LAB certificate.
        // GitHub Actions must provision main-app signing secrets through protected storage.
        mainApp {
            storeFile file(System.getenv('MOTORLAB_MAIN_KEYSTORE') ?: 'missing-protected-main-signing.jks')
            storePassword System.getenv('MOTORLAB_MAIN_STORE_PASSWORD') ?: 'UNCONFIGURED'
            keyAlias System.getenv('MOTORLAB_MAIN_KEY_ALIAS') ?: 'unconfigured-main-signing'
            keyPassword System.getenv('MOTORLAB_MAIN_KEY_PASSWORD') ?: 'UNCONFIGURED'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.mainApp
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
