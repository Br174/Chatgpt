plugins {
    id 'com.android.application'
}

android {
    namespace 'it.motorlab.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.motorlab.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        // Only the isolated signing-family emulator test may temporarily build
        // versionCode 7. The protected release always uses the default code 6.
        if (project.hasProperty('motorlabVersionCode')) {
            int candidateCode = project.property('motorlabVersionCode').toString().toInteger()
            if (candidateCode < 6) throw new GradleException('MotorLab update-family versionCode must be >= 6')
            versionCode candidateCode
        }
        versionName '0.6.0-unified-LAB'
    }

    signingConfigs {
        lab {
            storeFile file(System.getenv('MOTORLAB_LAB_KEYSTORE') ?: 'missing-test-only-keystore.jks')
            storePassword System.getenv('MOTORLAB_LAB_PASSWORD') ?: 'disabled'
            keyAlias 'motorlab-lab'
            keyPassword System.getenv('MOTORLAB_LAB_PASSWORD') ?: 'disabled'
        }
        // Canonical MotorLab must NEVER use the disposable LAB certificate.
        // GitHub Actions must provision main-app signing secrets through protected storage.
        mainApp {
            storeFile file(System.getenv('MOTORLAB_MAIN_KEYSTORE') ?: 'missing-protected-main-signing.jks')
            storePassword System.getenv('MOTORLAB_MAIN_STORE_PASSWORD') ?: 'UNCONFIGURED'
            keyAlias System.getenv('MOTORLAB_MAIN_KEY_ALIAS') ?: 'unconfigured-main-signing'
            keyPassword System.getenv('MOTORLAB_MAIN_KEY_PASSWORD') ?: 'UNCONFIGURED'
        }
    }

    buildTypes {
        debug {
            // Opt-in TEMPORARY signing for CI's v6->v7 upgrade test only.
            // Never part of production releases, never publish test APKs.
            if (project.hasProperty('motorlabSignedUpdateTest')) {
                signingConfig signingConfigs.mainApp
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.mainApp
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
