name: Pac-Man staging launcher (manual, protected)
on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy isolated Pac-Man Worker (protected staging approval required)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pacman-staging-launcher
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f57b61cd2959119412760203c0cd1972a23f3e7
          persist-credentials: false
      - name: Verify staging target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('tools/motorlab-pacman/wrangler.pacman-execution-staging.jsonc','utf8'));
          if(c.workers_dev!==true||c.d1_databases?.length!==1||c.d1_databases[0].binding!=='DB'||c.name!=='motorlab-pacman-execution-staging-lab'||c.main!=='./worker-execution-staging.mjs'||c.d1_databases[0].database_name!=='motorlab-pacman-staging'||c.d1_databases[0].database_id!=='eb834fc1-5589-4f75-bcb9-d311d0d72261') throw Error('STAGING_SCOPE_MISMATCH');
          NODE
          node --test tools/motorlab-pacman/*.test.mjs
          test "$(git rev-parse HEAD)" = 6f57b61cd2959119412760203c0cd1972a23f3e7
  deploy:
    needs: preflight
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true }}
    runs-on: ubuntu-latest
    environment: pacman-execution-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f57b61cd2959119412760203c0cd1972a23f3e7
          persist-credentials: false
      - name: Recheck exact staging target before deployment
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('tools/motorlab-pacman/wrangler.pacman-execution-staging.jsonc','utf8'));
          if(c.name!=='motorlab-pacman-execution-staging-lab'||c.main!=='./worker-execution-staging.mjs'||c.workers_dev!==true||c.d1_databases?.length!==1||c.d1_databases[0].binding!=='DB'||c.d1_databases[0].database_name!=='motorlab-pacman-staging'||c.d1_databases[0].database_id!=='eb834fc1-5589-4f75-bcb9-d311d0d72261') throw Error('STAGING_SCOPE_MISMATCH');
          NODE
          test "$(git rev-parse HEAD)" = 6f57b61cd2959119412760203c0cd1972a23f3e7
      - name: Check protected staging credentials
        env:
          APPROVED: ${{ vars.PACMAN_EXECUTION_ACTIVATION_APPROVED }}
          TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          ACCOUNT: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        run: |
          test "$APPROVED" = YES_STAGING_EXECUTION_ONLY || exit 1
          test -n "$TOKEN" && test -n "$ACCOUNT" || exit 1
          test "$ACCOUNT" = b86f445c2b57e604c02f79c8da64bb9c || { echo "::error::Cloudflare account is not the isolated staging account"; exit 1; }
      - name: Verify Cloudflare staging D1 identity (read-only API)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account='b86f445c2b57e604c02f79c8da64bb9c';
          const db='eb834fc1-5589-4f75-bcb9-d311d0d72261';
          if(process.env.CLOUDFLARE_ACCOUNT_ID!==account) throw Error('STAGING_ACCOUNT_MISMATCH');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db;
          const res=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(12000)});
          if(!res.ok) throw Error('STAGING_D1_IDENTITY_GET_FAILED_HTTP_'+res.status);
          const body=await res.json();
          if(body.success!==true||body.result?.uuid!==db||body.result?.name!=='motorlab-pacman-staging') throw Error('STAGING_D1_IDENTITY_MISMATCH');
          console.log('PACMAN_STAGING_D1_IDENTITY_VERIFIED_READ_ONLY');
          NODE
      - name: Deploy dedicated staging Worker
        working-directory: tools/motorlab-pacman
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.pacman-execution-staging.jsonc
