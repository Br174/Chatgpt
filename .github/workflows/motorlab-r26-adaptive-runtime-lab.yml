name: MotorLab r26 Adaptive Runtime LAB
on:
  push:
    branches:
      - lab/motorlab-adaptive-runtime-r26
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execution Fabric tests
        run: node --test tests/motorlab-execution-fabric.test.mjs
      - name: r25 semantic workgroups benchmark
        run: node tests/motorlab-semantic-workgroups-benchmark.mjs
      - name: r25 intrinsic dispatcher benchmark
        run: node tests/motorlab-intrinsic-speed-benchmark.mjs
      - name: r26 adaptive runtime benchmark
        run: node tests/motorlab-r26-adaptive-runtime-benchmark.mjs

