name: MotorLab D1 OIDC Relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/MOTORLAB_D1_OUTBOX.json'
      - 'relay/MOTORLAB_EVENT_OUTBOX.json'
      - '.github/workflows/motorlab-d1-oidc-relay.yml'
  workflow_dispatch:
    inputs:
      relay_source:
        description: 'Explicit authorized relay replay (none by default)'
        required: true
        type: choice
        default: none
        options:
          - none
          - event
          - legacy

permissions:
  contents: read
  id-token: write

concurrency:
  group: motorlab-d1-oidc-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select fresh authorized outbox (never silently replay stale legacy state)
        id: select
        shell: bash
        env:
          RELAY_SOURCE: ${{ inputs.relay_source || 'none' }}
        run: |
          set -euo pipefail
          legacy="relay/MOTORLAB_D1_OUTBOX.json"
          event="relay/MOTORLAB_EVENT_OUTBOX.json"
          selected=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$RELAY_SOURCE" in
              event) selected="$event" ;;
              legacy) selected="$legacy" ;;
              none) echo "No explicit replay selected; no D1 write." ;;
              *) echo "Unauthorized relay selector"; exit 1 ;;
            esac
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
            if printf '%s\n' "$changed" | grep -Fqx "$event"; then selected="$event"; fi
            if printf '%s\n' "$changed" | grep -Fqx "$legacy"; then
              if [[ -n "$selected" ]]; then echo "Multiple outboxes changed: fail closed"; exit 1; fi
              selected="$legacy"
            fi
          else
            echo "Unknown workflow event: no write."
          fi
          if [[ -n "$selected" ]]; then
            test -f "$selected" || { echo "Missing selected outbox"; exit 1; }
            echo "source=$selected" >> "$GITHUB_OUTPUT"
            echo "Selected $selected for authenticated OIDC relay"
          fi

      - name: Relay snapshot with GitHub OIDC
        if: steps.select.outputs.source != ''
        env:
          MOTORLAB_BASE: https://motorlab-state-bridge.brunoverlezza.workers.dev
          MOTORLAB_RELAY_SOURCE: ${{ steps.select.outputs.source }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request

          base = os.environ["MOTORLAB_BASE"].rstrip("/")
          path = os.environ["MOTORLAB_RELAY_SOURCE"]
          if path not in ("relay/MOTORLAB_D1_OUTBOX.json", "relay/MOTORLAB_EVENT_OUTBOX.json"):
              raise SystemExit("Unapproved relay source")
          with open(path, "rb") as fh:
              raw = fh.read()
          snapshot = json.loads(raw.decode("utf-8"))
          snapshot_id = snapshot["snapshot_id"]
          payload_hash = hashlib.sha256(raw).hexdigest()

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          joiner = "&" if "?" in request_url else "?"
          oidc_url = request_url + joiner + urllib.parse.urlencode({"audience": "motorlab-state-bridge"})
          token_req = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"bearer {request_token}", "Accept": "application/json"},
          )
          with urllib.request.urlopen(token_req, timeout=10) as response:
              token = json.loads(response.read().decode("utf-8"))["value"]

          relay_req = urllib.request.Request(
              f"{base}/control/v1/oidc-relay",
              data=raw,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "MotorLab-D1-OIDC-Relay/1.0",
              },
          )
          try:
              with urllib.request.urlopen(relay_req, timeout=15) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"OIDC relay HTTP {error.code}: {detail}")
          if result.get("snapshot_id") != snapshot_id or result.get("payload_hash") != payload_hash:
              raise SystemExit("OIDC relay returned unexpected snapshot identity")

          verify_req = urllib.request.Request(
              f"{base}/verify/{urllib.parse.quote(snapshot_id, safe='')}",
              headers={"Accept": "application/json", "User-Agent": "MotorLab-D1-OIDC-Relay/1.0"},
          )
          with urllib.request.urlopen(verify_req, timeout=10) as response:
              verified = json.loads(response.read().decode("utf-8"))
          if verified.get("snapshot_id") != snapshot_id or verified.get("payload_hash") != payload_hash:
              raise SystemExit("D1 verification failed")

          print(f"MOTORLAB_D1_OIDC_RELAY=PASSED snapshot_id={snapshot_id} sha256={payload_hash} idempotent={result.get('idempotent', False)} source={path}")
          PY
