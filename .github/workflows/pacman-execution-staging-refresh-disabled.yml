name: Pac-Man execution staging refresh (V2, disabled)

# Manual disaster-recovery only. Never auto-deploy in parallel with protected Execution LAB.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacman-execution-staging-refresh-disabled
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Br174/Chatgpt' && github.ref == 'refs/heads/motorlab/pacman-execution-v2-lab-20261014'
    runs-on: ubuntu-latest
    environment: pacman-execution-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify complete Pac-Man LAB suites
        run: |
          node --test tools/motorlab-pacman/*.test.mjs
          node --test tools/motorlab-pacman/candidates/*.test.mjs

      - name: Verify exact execution Worker target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('tools/motorlab-pacman/wrangler.pacman-execution-staging.jsonc','utf8'));
          if(c.name!=='motorlab-pacman-execution-staging-lab'||
             c.main!=='./worker-execution-staging.mjs'||c.workers_dev!==true||
             c.d1_databases?.length!==1||
             c.d1_databases[0].binding!=='DB'||
             c.d1_databases[0].database_id!=='eb834fc1-5589-4f75-bcb9-d311d0d72261')
            throw Error('EXECUTION_STAGING_SCOPE_MISMATCH');
          NODE

      - name: Require exact Cloudflare staging credentials
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::PACMAN_CF_API_TOKEN missing"; exit 1; }
          test "$CF_ACCOUNT" = "b86f445c2b57e604c02f79c8da64bb9c" || { echo "::error::Wrong Cloudflare account"; exit 1; }

      - name: Refuse refresh if execution is already enabled
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account='b86f445c2b57e604c02f79c8da64bb9c';
          const worker='motorlab-pacman-execution-staging-lab';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/settings',{
            headers:{Authorization:'Bearer '+process.env.CF_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)
          });
          if(r.status===404){console.log('EXECUTION_WORKER_NEW_TARGET');process.exit(0);}
          if(!r.ok)throw Error('EXECUTION_PREFLIGHT_HTTP_'+r.status);
          const j=await r.json();
          if(j.success!==true||!Array.isArray(j.result?.bindings))throw Error('EXECUTION_PREFLIGHT_INVALID');
          const enabled=['PACMAN_TRUSTED_ISSUER_CONNECTED','PACMAN_GITHUB_LAB_WRITE_ENABLED','PACMAN_CYCLE_ROUTE_ENABLED','PACMAN_D1_CHECKPOINTS_VERIFIED'];
          if(j.result.bindings.some(x=>enabled.includes(x.name)))throw Error('EXECUTION_ALREADY_ENABLED_ABORT');
          console.log('EXECUTION_TARGET_CONFIRMED_DISABLED');
          NODE

      - name: Deploy current V2 execution Worker still disabled
        id: deploy
        working-directory: tools/motorlab-pacman
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.pacman-execution-staging.jsonc 2>&1 | tee "$RUNNER_TEMP/execution-refresh.log"
          worker_url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/execution-refresh.log" | head -n 1 || true)"
          test -n "$worker_url" || { echo "::error::Worker URL not reported"; exit 1; }
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify exact V2 revision, D1 and disabled state
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          node --input-type=module <<'NODE'
          const account='b86f445c2b57e604c02f79c8da64bb9c';
          const worker='motorlab-pacman-execution-staging-lab';
          const settings=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/settings',{
            headers:{Authorization:'Bearer '+process.env.CF_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)
          });
          if(!settings.ok)throw Error('EXECUTION_READBACK_HTTP_'+settings.status);
          const sj=await settings.json();
          const bindings=sj.result?.bindings;
          if(sj.success!==true||!Array.isArray(bindings))throw Error('EXECUTION_READBACK_INVALID');
          const forbidden=['PACMAN_TRUSTED_ISSUER_CONNECTED','PACMAN_GITHUB_LAB_WRITE_ENABLED','PACMAN_CYCLE_ROUTE_ENABLED','PACMAN_D1_CHECKPOINTS_VERIFIED'];
          if(bindings.some(x=>forbidden.includes(x.name)))throw Error('EXECUTION_UNEXPECTEDLY_ENABLED');
          if(!bindings.some(x=>x.name==='DB'&&x.type==='d1'&&x.id==='eb834fc1-5589-4f75-bcb9-d311d0d72261'))
            throw Error('EXECUTION_D1_BINDING_MISMATCH');

          const health=await fetch(process.env.WORKER_URL+'/health',{redirect:'error',signal:AbortSignal.timeout(15000)});
          const body=await health.json();
          if(health.status!==200||body.service!=='pacman-execution-staging'||body.database!=='CONNECTED'||
             body.revision!=='pacman-v2-webauthn-relay-20261016')
            throw Error('EXECUTION_V2_HEALTH_MISMATCH');
          console.log('EXECUTION_V2_STAGING_REFRESHED_AND_DISABLED');
          NODE
