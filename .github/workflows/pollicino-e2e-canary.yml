name: MotorLab Pollicino E2E Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pollicino-e2e-canary.yml'
      - 'cloudflare/motorlab-state-bridge/**'
      - 'templates/codex/motorlab/motorlab_pollicino.py'
      - 'MOTORLAB_POLLICINO_CONTINUITY_V1.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOTORLAB_BASE: https://motorlab-state-bridge.brunoverlezza.workers.dev
      MUSICLAB_PROOF_HEAD: 966c40dbfb3746d56de199c8beb35558bf150a92
      MUSICLAB_OPERATION_ID: musiclab-lab44-original-first-scoring-coverinfo-video-readiness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static Pollicino regression suite
        run: |
          node --test cloudflare/motorlab-state-bridge/test/pollicino.test.mjs
          python3 -m py_compile templates/codex/motorlab/motorlab_pollicino.py

      - name: Run Pollicino detector and recovery canary
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          base = os.environ["MOTORLAB_BASE"].rstrip("/")
          proof_head = os.environ["MUSICLAB_PROOF_HEAD"]
          expected_operation = os.environ["MUSICLAB_OPERATION_ID"]
          run_id = os.environ["RUN_ID"]

          def req(method, url, payload=None, headers=None, timeout=10):
              body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              h = {"Accept": "application/json", "User-Agent": "MotorLab-Pollicino-E2E/2.0"}
              if payload is not None:
                  h["Content-Type"] = "application/json"
              if headers:
                  h.update(headers)
              request = urllib.request.Request(url, data=body, method=method, headers=h)
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      raw = response.read().decode()
                      return response.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"HTTP {error.code} {url}: {detail}")

          q = urllib.parse.urlencode({"project_id": "MusicLab", "source_head": proof_head})
          _, context = req("GET", f"{base}/continuity/v1/context?{q}")
          operation_id = context["context"]["operation_id"]
          if operation_id != expected_operation or context.get("proof") != "SATELLITE_PROOF_HEAD":
              raise SystemExit("Source-proof context mismatch")
          print("SOURCE_PROOF_CONTEXT=PASSED")

          def enroll(session_id):
              _, data = req("POST", f"{base}/continuity/v1/enroll", {
                  "project_id": "MusicLab",
                  "session_id": session_id,
                  "source_head": proof_head,
                  "executor_type": "github-actions-canary",
              })
              token = data.get("session_token")
              if not token or data.get("operation_id") != operation_id:
                  raise SystemExit("Enrollment failed")
              return token

          def pulse(session_id, token, fingerprint, lease_ms=15000, stall_pulses=3):
              _, data = req("POST", f"{base}/continuity/v1/pulse", {
                  "project_id": "MusicLab",
                  "operation_id": operation_id,
                  "session_id": session_id,
                  "executor_type": "github-actions-canary",
                  "liveness_mode": "PUSH_HEARTBEAT",
                  "progress_fingerprint": fingerprint,
                  "progress_expected": True,
                  "lease_ms": lease_ms,
                  "stall_after_unchanged_pulses": stall_pulses,
                  "phase": "POLLICINO_E2E_CANARY",
                  "current_action": "canary",
                  "next_action": "verify continuity state",
                  "verified_progress": 100,
                  "source_ref": "uab-build/musiclab-scoring-coverinfo-video-44",
                  "source_head": proof_head,
                  "sent_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              }, {"Authorization": f"Bearer {token}"})
              return data

          def status(token):
              q = urllib.parse.urlencode({"project_id": "MusicLab", "operation_id": operation_id})
              _, data = req("GET", f"{base}/continuity/v1/status?{q}", headers={"Authorization": f"Bearer {token}"})
              return data

          def seal(session_id, token, terminal_state):
              _, data = req("POST", f"{base}/continuity/v1/seal", {
                  "project_id": "MusicLab",
                  "operation_id": operation_id,
                  "session_id": session_id,
                  "terminal_state": terminal_state,
              }, {"Authorization": f"Bearer {token}"})
              return data

          # Alive + unchanged fingerprint -> stall suspicion -> prepared resume packet.
          stall_session = f"e2e-stall-{run_id}"
          stall_token = enroll(stall_session)
          first = pulse(stall_session, stall_token, "fp-A")
          if first.get("progress_state") != "MOVING":
              raise SystemExit(f"Initial moving pulse failed: {first}")
          for _ in range(3):
              last = pulse(stall_session, stall_token, "fp-A")
              time.sleep(1)
          if last.get("progress_state") != "STALL_SUSPECTED":
              raise SystemExit(f"STALL_SUSPECTED not detected: {last}")
          st = status(stall_token)
          if (st.get("resume_ready") or {}).get("status") != "READY_STALL_SUSPECTED":
              raise SystemExit(f"READY_STALL_SUSPECTED not prepared: {st}")
          print("STALL_DETECTION=PASSED")
          print("STALL_RESUME_READY=PASSED")

          # Progress changes -> stale stall recovery packet is superseded.
          resumed = pulse(stall_session, stall_token, "fp-B")
          if resumed.get("progress_state") != "MOVING":
              raise SystemExit(f"Progress resume not detected: {resumed}")
          st = status(stall_token)
          if (st.get("resume_ready") or {}).get("status") != "SUPERSEDED_PROGRESS_RESUMED":
              raise SystemExit(f"Stale stall packet not superseded: {st}")
          print("PROGRESS_RESUME=PASSED")

          sealed = seal(stall_session, stall_token, "HANDOFF_COMPLETE")
          if sealed.get("terminal_seal") != "HANDOFF_COMPLETE":
              raise SystemExit(f"Normal terminal seal failed: {sealed}")
          print("NORMAL_TERMINAL_SEAL=PASSED")

          # New session deliberately stops heartbeating. Alarm must prepare recovery before any user message.
          crash_session = f"e2e-crash-{run_id}"
          crash_token = enroll(crash_session)
          crash_first = pulse(crash_session, crash_token, "fp-C", lease_ms=5000, stall_pulses=20)
          if crash_first.get("liveness_state") != "ALIVE":
              raise SystemExit(f"Crash-session initial pulse failed: {crash_first}")

          crash_ready = False
          for _ in range(15):
              time.sleep(2)
              st = status(crash_token)
              session = st.get("session") or {}
              ready = st.get("resume_ready") or {}
              if session.get("liveness_state") == "LOST" and ready.get("status") == "READY_PRECOMPUTED":
                  crash_ready = True
                  break
          if not crash_ready:
              raise SystemExit(f"Crash/liveness-loss RESUME_READY not prepared: {st}")
          print("CRASH_DETECTION=PASSED")
          print("PREEMPTIVE_RESUME_READY=PASSED")

          # Fresh-chat style read: no session token; stable adopted satellite proof head only.
          q = urllib.parse.urlencode({
              "project_id": "MusicLab",
              "operation_id": operation_id,
              "source_head": proof_head,
          })
          _, ready = req("GET", f"{base}/continuity/v1/resume-ready?{q}")
          if ready.get("resume_ready", {}).get("status") != "READY_PRECOMPUTED":
              raise SystemExit(f"Source-proof RESUME_READY read failed: {ready}")
          print("FRESH_CHAT_RESUME_READ=PASSED")

          sealed = seal(crash_session, crash_token, "SAFE_STOP")
          if sealed.get("terminal_seal") != "SAFE_STOP":
              raise SystemExit(f"Post-canary SAFE_STOP seal failed: {sealed}")
          print("POST_CANARY_SAFE_STOP=PASSED")

          print("POLLICINO_E2E_CANARY=PASSED")
          PY

      - name: Verify exact Codex Pollicino sidecar with local stable proof
        env:
          RUN_ID: ${{ github.run_id }}
          MOTORLAB_PROJECT_ID: MusicLab
          MOTORLAB_POLLICINO_PULSE_SECONDS: '5'
          MOTORLAB_POLLICINO_LEASE_MS: '15000'
        run: |
          export MOTORLAB_HOOK_STATE_DIR="$RUNNER_TEMP/motorlab-pollicino-sidecar"
          mkdir -p "$MOTORLAB_HOOK_STATE_DIR"
          probe="$RUNNER_TEMP/musiclab-pollicino-probe"
          mkdir -p "$probe/.motorlab"
          printf '%s\n' 'MOTORLAB_SYNC_STATE' 'POLLICINO_PROOF_HEAD=966c40dbfb3746d56de199c8beb35558bf150a92' > "$probe/.motorlab/MOTORLAB_SYNC_STATE.txt"
          export MOTORLAB_PROBE_CWD="$probe"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.parse, urllib.request

          run_id = os.environ["RUN_ID"]
          session_id = f"adapter-{run_id}"
          cwd = os.environ["MOTORLAB_PROBE_CWD"]
          adapter = os.path.join(os.environ["GITHUB_WORKSPACE"], "templates/codex/motorlab/motorlab_pollicino.py")
          state_path = pathlib.Path(os.environ["MOTORLAB_HOOK_STATE_DIR"]) / f"{session_id}.json"
          base = "https://motorlab-state-bridge.brunoverlezza.workers.dev/continuity/v1"
          expected_operation = "musiclab-lab44-original-first-scoring-coverinfo-video-readiness"
          expected_proof = "966c40dbfb3746d56de199c8beb35558bf150a92"

          def hook(event):
              payload = {"session_id":session_id,"hook_event_name":event,"cwd":cwd,"turn_id":f"{run_id}-{event}"}
              subprocess.run(["python3",adapter],input=json.dumps(payload),text=True,check=True,env=os.environ.copy())

          def status(token, operation_id):
              q = urllib.parse.urlencode({"project_id":"MusicLab","operation_id":operation_id})
              req = urllib.request.Request(f"{base}/status?{q}",headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=10) as response:
                  return json.loads(response.read().decode())

          hook("SessionStart")
          for _ in range(10):
              if state_path.exists():
                  state=json.loads(state_path.read_text())
                  token=state.get("session_token")
                  operation_id=state.get("operation_id")
                  if token and operation_id:
                      try:
                          remote=status(token,operation_id)
                          if (remote.get("session") or {}).get("liveness_state")=="ALIVE":
                              break
                      except Exception:
                          pass
              time.sleep(1)
          else:
              redacted = {}
              if state_path.exists():
                  try:
                      current = json.loads(state_path.read_text())
                      redacted = {
                          "operation_id": current.get("operation_id"),
                          "project_id": current.get("project_id"),
                          "proof_head": current.get("proof_head"),
                          "source_head": current.get("source_head"),
                          "token_present": bool(current.get("session_token")),
                          "initial_pulse_ok": current.get("initial_pulse_ok"),
                          "daemon_pid_present": bool(current.get("daemon_pid")),
                      }
                  except Exception:
                      pass
              raise SystemExit(f"Exact sidecar failed to self-enroll/pulse: {redacted}")

          if operation_id != expected_operation:
              raise SystemExit(f"Unexpected sidecar operation {operation_id}")
          if state.get("proof_head") != expected_proof:
              raise SystemExit(f"Local stable proof not consumed: {state.get('proof_head')}")
          if state.get("source_head") == expected_proof:
              raise SystemExit("Runtime source head was incorrectly overwritten by proof anchor")
          print("CODEX_SIDECAR_LOCAL_PROOF=PASSED")
          print("CODEX_SIDECAR_RUNTIME_HEAD_SEPARATION=PASSED")
          print("CODEX_SIDECAR_SELF_ENROLL=PASSED")
          print("CODEX_SIDECAR_LIVENESS=PASSED")

          hook("SessionEnd")
          time.sleep(1)
          remote=status(token,operation_id)
          if (remote.get("session") or {}).get("terminal_seal")!="HANDOFF_COMPLETE":
              raise SystemExit("Exact sidecar terminal seal failed")
          print("CODEX_SIDECAR_TERMINAL_SEAL=PASSED")
          print("CODEX_SIDECAR_LIFECYCLE=PASSED")
          PY
# retrigger: provider runner recovered 2026-10-05
