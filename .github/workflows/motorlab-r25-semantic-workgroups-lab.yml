name: MotorLab r25 Semantic Workgroups LAB
on:
  push:
    branches:
      - lab/motorlab-semantic-workgroups-r25
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execution Fabric tests
        run: node --test tests/motorlab-execution-fabric.test.mjs
      - name: r24 vs r25 semantic workgroups benchmark
        run: node tests/motorlab-semantic-workgroups-benchmark.mjs
      - name: Intrinsic dispatcher speed benchmark
        run: node tests/motorlab-intrinsic-speed-benchmark.mjs
