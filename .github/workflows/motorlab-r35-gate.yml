name: MotorLab r35 verified rules gate

on:
  push:
    branches:
      - 'motorlab-r35-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test r35 Regola Madre, preserved safety contracts and live boot
        run: node --test tests/motorlab-r35-verified-supersession.test.mjs
