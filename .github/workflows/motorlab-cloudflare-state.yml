name: MotorLab Cloudflare central state

on:
  push:
    branches:
      - motorlab/cloudflare-state-r16
    paths:
      - 'cloudflare/motorlab-state-bridge/**'
      - '.github/workflows/motorlab-cloudflare-state.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motorlab-cloudflare-central-state
  cancel-in-progress: false

jobs:
  test:
    name: Test bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/motorlab-state-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker unit tests
        run: npm test
      - name: Validate D1 schema
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          sql = pathlib.Path('migrations/0001_initial.sql').read_text()
          db = sqlite3.connect(':memory:')
          db.executescript(sql)
          expected = {'relay_snapshots','projects','operations','approvals','checkpoints','locks','artifacts','root_causes','operation_events'}
          actual = {row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          missing = expected - actual
          assert not missing, missing
          print(f'schema-ok:{len(expected)}')
          PY

  deploy:
    name: Provision D1/KV and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/motorlab-state-bridge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '5781b597517f6f7fe25751170a99b9ab'
      MOTORLAB_RELAY_SECRET: ${{ secrets.MOTORLAB_RELAY_SECRET }}
      WORKER_URL: https://motorlab-state-bridge.brunoverlezza.workers.dev
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$MOTORLAB_RELAY_SECRET"

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$(jq -r '.success' <<<"$response")" = "true"

      - name: Create or reuse isolated D1 and KV
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          d1_id="$(npx --yes wrangler@4.45.0 d1 list --json | jq -r '.[]? | select(.name == "motorlab-operational-state-db") | (.uuid // .id)' | head -n1)"
          if [ -z "$d1_id" ]; then
            npx --yes wrangler@4.45.0 d1 create motorlab-operational-state-db --location weur >/tmp/motorlab-d1-create.txt
            d1_id="$(npx --yes wrangler@4.45.0 d1 list --json | jq -r '.[]? | select(.name == "motorlab-operational-state-db") | (.uuid // .id)' | head -n1)"
          fi
          test -n "$d1_id"

          kv_id="$(npx --yes wrangler@4.45.0 kv namespace list | jq -r '.[]? | select(.title == "motorlab-operational-cache") | .id' | head -n1)"
          if [ -z "$kv_id" ]; then
            npx --yes wrangler@4.45.0 kv namespace create motorlab-operational-cache >/tmp/motorlab-kv-create.txt
            kv_id="$(npx --yes wrangler@4.45.0 kv namespace list | jq -r '.[]? | select(.title == "motorlab-operational-cache") | .id' | head -n1)"
          fi
          test -n "$kv_id"
          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"
          echo "kv_id=$kv_id" >> "$GITHUB_OUTPUT"

      - name: Render runtime Wrangler config
        env:
          MOTORLAB_D1_ID: ${{ steps.resources.outputs.d1_id }}
          MOTORLAB_KV_ID: ${{ steps.resources.outputs.kv_id }}
        run: node scripts/render-wrangler.mjs

      - name: Apply D1 migrations
        run: npx --yes wrangler@4.45.0 d1 migrations apply motorlab-operational-state-db --remote --config wrangler.generated.jsonc

      - name: Configure relay secret in Worker
        shell: bash
        run: printf '%s' "$MOTORLAB_RELAY_SECRET" | npx --yes wrangler@4.45.0 secret put RELAY_SECRET --config wrangler.generated.jsonc

      - name: Deploy Worker
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.generated.jsonc

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if response="$(curl --fail-with-body --silent --show-error "$WORKER_URL/health")" \
              && jq -e '.status == "ok" and .service == "motorlab-state-bridge" and .schema_version == 1' <<<"$response" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Signed bootstrap relay and D1 verification
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node scripts/bootstrap-snapshot.mjs)"
          timestamp="$(date +%s)"
          signature="$(printf '%s' "$payload" | MOTORLAB_TIMESTAMP="$timestamp" node scripts/sign-stdin.mjs)"
          response="$(curl --fail-with-body --silent --show-error \
            -H 'content-type: application/json' \
            -H "x-motorlab-timestamp: $timestamp" \
            -H "x-motorlab-signature: $signature" \
            --data "$payload" \
            "$WORKER_URL/relay")"
          snapshot_id="$(jq -r '.snapshot_id' <<<"$response")"
          payload_hash="$(jq -r '.payload_hash' <<<"$response")"
          test "$(jq -r '.cache_verified' <<<"$response")" = "true"
          verify="$(curl --fail-with-body --silent --show-error "$WORKER_URL/verify/$snapshot_id")"
          test "$(jq -r '.payload_hash' <<<"$verify")" = "$payload_hash"
          test "$(jq -r '.schema_version' <<<"$verify")" = "1"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
          echo "payload_hash=$payload_hash" >> "$GITHUB_OUTPUT"

      - name: Verify KV cache directly
        env:
          KV_ID: ${{ steps.resources.outputs.kv_id }}
        shell: bash
        run: |
          set -euo pipefail
          cache="$(npx --yes wrangler@4.45.0 kv key get 'project:motorlab:current' --namespace-id "$KV_ID" --text --remote)"
          test "$(jq -r '.project_id' <<<"$cache")" = "motorlab"
          test -n "$(jq -r '.payload_hash' <<<"$cache")"
