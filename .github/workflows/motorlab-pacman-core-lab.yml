name: MotorLab Pacman CORE Alias and Auto-Routing (isolated policy LAB)
on:
  push:
    branches:
      - motorlab/pacman-autosetup-core-lab-20261014
    paths:
      - 'MOTORLAB_CORE_ENTRYPOINT_V1.txt'
      - 'MOTORLAB_AUTO_BOOTSTRAP_V1.txt'
      - 'MOTORLAB_REENTRY_GATE_V1.txt'
      - 'MOTORLAB_BOOT_CAPSULE_V1.txt'
      - 'MOTORLAB_RELEASE_MANIFEST_V1.txt'
      - 'tools/motorlab-pacman/**'
      - 'tests/motorlab-r37-pacman-release.test.mjs'
      - 'tests/motorlab-r37-pacman-release.test.mjs'
      - '.github/workflows/motorlab-pacman-core-lab.yml'
      - 'checkpoints/MOTORLAB_PACMAN_CORE_LAB_20261014.txt'
  pull_request:
    paths:
      - 'MOTORLAB_CORE_ENTRYPOINT_V1.txt'
      - 'MOTORLAB_AUTO_BOOTSTRAP_V1.txt'
      - 'MOTORLAB_REENTRY_GATE_V1.txt'
      - 'MOTORLAB_BOOT_CAPSULE_V1.txt'
      - 'MOTORLAB_RELEASE_MANIFEST_V1.txt'
      - 'tools/motorlab-pacman/**'
      - '.github/workflows/motorlab-pacman-core-lab.yml'
      - 'checkpoints/MOTORLAB_PACMAN_CORE_LAB_20261014.txt'
permissions:
  contents: read
jobs:
  pacman-core-policy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 15 offline Pacman canonical/negative/continuity tests
        run: node --test tools/motorlab-pacman/test-pacman-core.mjs tests/motorlab-r37-pacman-release.test.mjs
      - name: Protect main release, production & Android
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const m=fs.readFileSync('MOTORLAB_RELEASE_MANIFEST_V1.txt','utf8');
          const archive=m.includes('R39_PHASE=CONTROL_PLANE_FANOUT_COMPLETE_NATIVE_ENFORCEMENT_PENDING')&&m.includes('SCUDO360_GLOBAL_RELEASE=CONTROL_PLANE_VERIFIED_6_OF_6_NATIVE_GATES_PENDING');
          const current=m.includes('CURRENT_RELEASE=2026.10.29-r39') || (m.includes('CURRENT_RELEASE=2026.10.29-r40') && m.includes('R40_TESTED_SIX_NATIVE_PILOTS=6/6') && ((m.includes('R40_PHASE=CORE_PREPARED_FANOUT_IN_PROGRESS') && m.includes('R40_FANOUT_COMPLETE=NO_UNTIL_SIX_SAFE_SATELLITE_RECEIPTS')) || (m.includes('R40_PHASE=CORE_AND_SIX_MAIN_PLUS_TWO_ACTIVE_CONTROL_PLANE_VERIFIED') && m.includes('R40_MAIN_VERIFIED=6/6_EXACT_BLOBS') && (m.includes('R40_FANOUT_COMPLETE=YES_CONTROL_PLANE_MAIN6_ACTIVE2_NATIVES_PENDING') || (m.includes('R40_FANOUT_COMPLETE=YES_CONTROL_PLANE_MAIN6_ACTIVE2_NATIVE_WORKFLOWS6_VERIFIED') && m.includes('R40_NATIVE_MAIN_WORKFLOW_ENFORCEMENT=VERIFIED_SIX_OF_SIX_ACTIVE_NATIVE_PIPELINES') && fs.readFileSync('checkpoints/MOTORLAB_SCUDO360_R40_NATIVE_ENFORCEMENT_PROGRESS_20261029.txt','utf8').includes('R40_GLOBAL_NATIVE_GATING_COMPLETION=6/6_WITH_PROTECTED_MERGES_AND_REAL_GEO_APK_BUILD') && fs.readFileSync('checkpoints/MOTORLAB_SCUDO360_R40_NATIVE_ENFORCEMENT_PROGRESS_20261029.txt','utf8').includes('R40_GEO_APK_REAL_NATIVE_ACTION_RUN=https://github.com/Br174/GeoVision-Test/actions/runs/40979268250') && m.includes('R40_DEVICE_ACCEPTANCE=NOT_VERIFIED'))))));
          if(!archive||!current)throw Error('unapproved release or premature fanout claim');
          if(!m.includes('PACMAN_RELEASE_ACTIVATION=VERIFIED_CORE_AND_SIX_ACTIVE_MAINS'))throw Error('fanout bypass');
          const wf=fs.readFileSync('.github/workflows/motorlab-pacman-core-lab.yml','utf8');
          if(wf.split('\n').some(line=>/^\s*(?:npx\s+)?wrangler\s+(?:deploy|d1\s+execute)/.test(line)))throw Error('production-capable workflow');
          console.log('r39 archival safety and r40 protected transaction checked; no deploy, secrets, APK or device certification.');
          NODE
