name: MotorLab Pacman CORE Alias and Auto-Routing (isolated policy LAB)
on:
  push:
    branches:
      - motorlab/pacman-autosetup-core-lab-20261014
    paths:
      - 'MOTORLAB_CORE_ENTRYPOINT_V1.txt'
      - 'MOTORLAB_AUTO_BOOTSTRAP_V1.txt'
      - 'MOTORLAB_REENTRY_GATE_V1.txt'
      - 'MOTORLAB_BOOT_CAPSULE_V1.txt'
      - 'MOTORLAB_RELEASE_MANIFEST_V1.txt'
      - 'tools/motorlab-pacman/**'
      - 'tests/motorlab-r37-pacman-release.test.mjs'
      - 'tests/motorlab-r37-pacman-release.test.mjs'
      - '.github/workflows/motorlab-pacman-core-lab.yml'
      - 'checkpoints/MOTORLAB_PACMAN_CORE_LAB_20261014.txt'
  pull_request:
    paths:
      - 'MOTORLAB_CORE_ENTRYPOINT_V1.txt'
      - 'MOTORLAB_AUTO_BOOTSTRAP_V1.txt'
      - 'MOTORLAB_REENTRY_GATE_V1.txt'
      - 'MOTORLAB_BOOT_CAPSULE_V1.txt'
      - 'MOTORLAB_RELEASE_MANIFEST_V1.txt'
      - 'tools/motorlab-pacman/**'
      - '.github/workflows/motorlab-pacman-core-lab.yml'
      - 'checkpoints/MOTORLAB_PACMAN_CORE_LAB_20261014.txt'
permissions:
  contents: read
jobs:
  pacman-core-policy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 15 offline Pacman canonical/negative/continuity tests
        run: node --test tools/motorlab-pacman/test-pacman-core.mjs tests/motorlab-r37-pacman-release.test.mjs
      - name: Protect main release, production & Android
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const m=fs.readFileSync('MOTORLAB_RELEASE_MANIFEST_V1.txt','utf8');
          if(!m.includes('CURRENT_RELEASE=2026.10.29-r39') || !m.includes('R39_PHASE=CORE_CANDIDATE_PENDING_FANOUT') || !m.includes('SCUDO360_GLOBAL_RELEASE=IN_PROGRESS_NOT_YET_ACTIVE'))throw Error('unapproved release or premature fanout claim');
          if(!m.includes('PACMAN_RELEASE_ACTIVATION=VERIFIED_CORE_AND_SIX_ACTIVE_MAINS'))throw Error('fanout bypass');
          const wf=fs.readFileSync('.github/workflows/motorlab-pacman-core-lab.yml','utf8');
          if(wf.split('\n').some(line=>/^\s*(?:npx\s+)?wrangler\s+(?:deploy|d1\s+execute)/.test(line)))throw Error('production-capable workflow');
          console.log('r39 Scudo360 release staging only. No provider authentication, deployment, D1/KV, APK, MADRE or main promotion.');
          NODE
