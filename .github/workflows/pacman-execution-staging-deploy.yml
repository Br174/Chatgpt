name: Pacman execution staging deploy (LAB branch, protected)

on:
  push:
    branches:
      - motorlab/pacman-execution-v2-lab-20261014
    paths:
      - '.github/workflows/pacman-execution-staging-deploy.yml'
      - 'tools/motorlab-pacman/*.mjs'
      - 'tools/motorlab-pacman/*.jsonc'

permissions:
  contents: read

concurrency:
  group: pacman-execution-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Br174/Chatgpt' && github.ref == 'refs/heads/motorlab/pacman-execution-v2-lab-20261014'
    runs-on: ubuntu-latest
    environment: pacman-execution-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact isolated staging target
        working-directory: tools/motorlab-pacman
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('wrangler.pacman-execution-staging.jsonc','utf8'));
          if(c.workers_dev!==true ||
             c.name!=='motorlab-pacman-execution-staging-lab' ||
             c.main!=='./worker-execution-staging.mjs' ||
             c.d1_databases?.length!==1 ||
             c.d1_databases[0].binding!=='DB' ||
             c.d1_databases[0].database_name!=='motorlab-pacman-staging' ||
             c.d1_databases[0].database_id!=='eb834fc1-5589-4f75-bcb9-d311d0d72261') {
            throw Error('STAGING_SCOPE_MISMATCH');
          }
          console.log('DEDICATED_STAGING_WORKER_AND_D1_VERIFIED');
          NODE
      - name: Run Pacman LAB tests
        run: node --test tools/motorlab-pacman/*.test.mjs
      - name: Run isolated candidate and Worker boundary tests
        run: node --test tools/motorlab-pacman/candidates/*.test.mjs
      - name: Require protected staging credentials and activation flag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
          ACTIVATION_APPROVED: ${{ vars.PACMAN_EXECUTION_ACTIVATION_APPROVED }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::PACMAN_CF_API_TOKEN is missing from the protected staging environment"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = b86f445c2b57e604c02f79c8da64bb9c || { echo "::error::Cloudflare account is not MotorLab-Staging"; exit 1; }
          test "$ACTIVATION_APPROVED" = YES_STAGING_EXECUTION_ONLY || { echo "::error::Staging activation flag is not approved"; exit 1; }
      - name: Read-only preflight of LAB head, protected Worker secrets and exact D1 schemas
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          ACCOUNT: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.sha }}
          EXECUTION_KEY: ${{ secrets.PACMAN_EXECUTION_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account='b86f445c2b57e604c02f79c8da64bb9c';
          const db='eb834fc1-5589-4f75-bcb9-d311d0d72261';
          const name='motorlab-pacman-execution-staging-lab';
          const branch='motorlab/pacman-execution-v2-lab-20261014';
          const probe='tools/motorlab-pacman/probe-webauthn-cycle-20261017.txt';
          const conf=JSON.parse(fs.readFileSync('tools/motorlab-pacman/wrangler.pacman-execution-staging.jsonc','utf8'));
          const flags={
           PACMAN_CYCLE_ROUTE_ENABLED:'YES_REVIEWED_STAGING_CANDIDATE',
           PACMAN_TRUSTED_ISSUER_CONNECTED:'YES_VERIFIED_TRUSTED_HOST',
           PACMAN_GITHUB_LAB_WRITE_ENABLED:'YES_STAGING_LAB_ONLY',
           PACMAN_D1_CHECKPOINTS_VERIFIED:'YES_STAGING_D1_CHECKPOINTS_VERIFIED'
          };
          if(process.env.ACCOUNT!==account||!process.env.CF_TOKEN||
             !process.env.GH_TOKEN||!process.env.HEAD||
             typeof process.env.EXECUTION_KEY!=='string'||process.env.EXECUTION_KEY.length<32)
            throw Error('PACMAN_STAGING_CREDENTIALS_UNAVAILABLE');
          if(conf.name!==name||conf.main!=='./worker-execution-staging.mjs'||
             conf.workers_dev!==true||conf.d1_databases?.length!==1||
             conf.d1_databases[0].binding!=='DB'||
             conf.d1_databases[0].database_id!==db||
             conf.d1_databases[0].database_name!=='motorlab-pacman-staging'||
             Object.keys(conf.vars||{}).length!==0)
           throw Error('PACMAN_EXECUTION_SCOPE_INVALID');
          const ghHeaders={authorization:'Bearer '+process.env.GH_TOKEN,
            accept:'application/vnd.github+json','user-agent':'motorlab-pacman-execution-audit'};
          const git=async(url)=>fetch(url,{headers:ghHeaders,redirect:'manual',signal:AbortSignal.timeout(15000)});
          const gitHead=await git('https://api.github.com/repos/Br174/Chatgpt/git/ref/heads/'+branch);
          if(gitHead.status!==200||(await gitHead.json())?.object?.sha!==process.env.HEAD)
           throw Error('PACMAN_STALE_LAB_HEAD');
          const file=await git('https://api.github.com/repos/Br174/Chatgpt/contents/'+probe+'?ref='+encodeURIComponent(branch));
          if(file.status!==404)throw Error('PACMAN_PROBE_NOT_PROVEN_ABSENT');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          const headers={authorization:'Bearer '+process.env.CF_TOKEN,accept:'application/json'};
          const live=await fetch(base+'/workers/scripts/'+name+'/settings',{
           headers,redirect:'manual',signal:AbortSignal.timeout(15000)});
          if(live.status!==200)throw Error('PACMAN_EXECUTION_SETTINGS_UNAVAILABLE');
          const settings=await live.json(),bindings=settings?.result?.bindings;
          if(settings.success!==true||!Array.isArray(bindings))
           throw Error('PACMAN_EXECUTION_BINDINGS_UNVERIFIED');
          if(!bindings.some(b=>b.name==='DB'&&b.type==='d1'&&b.id===db))
           throw Error('PACMAN_EXECUTION_D1_TARGET_MISMATCH');
          for(const secret of ['PACMAN_EXECUTION_KEY','PACMAN_APPROVAL_SIGNING_SECRET','PACMAN_GITHUB_TOKEN']){
           if(!bindings.some(b=>b.name===secret&&b.type==='secret_text'))
            throw Error('PACMAN_EXECUTION_SECRET_BINDING_MISSING');
          }
          for(const name of Object.keys(flags)){
           // Existing issuer authority is not verified yet; refuse *any* live enable flag.
           if(bindings.some(b=>b.name===name))
            throw Error('PACMAN_EXECUTION_PREMATURE_FLAG_FOUND');
          }
          for(const [table,columns,types] of [
           ['pacman_approval_claims',['operation_id','approval_signature','claimed_at','expires_at'],['TEXT','TEXT','INTEGER','INTEGER']],
           ['pacman_cycle_checkpoints',['operation_id','state','branch','path','sha','updated_at'],['TEXT','TEXT','TEXT','TEXT','TEXT','TEXT']]
          ]){
           const response=await fetch(base+'/d1/database/'+db+'/query',{
            method:'POST',headers:{...headers,'content-type':'application/json'},
            body:JSON.stringify({sql:'PRAGMA table_info('+table+')'}),
            redirect:'manual',signal:AbortSignal.timeout(15000)
           });
           if(response.status!==200)throw Error('PACMAN_STAGING_D1_READ_NOT_AVAILABLE');
           const data=await response.json(),entry=data?.result?.[0],rows=entry?.results;
           if(data?.success!==true||entry?.success!==true||!Array.isArray(rows))
            throw Error('PACMAN_STAGING_D1_SCHEMA_UNVERIFIED');
           for(let i=0;i<columns.length;i++){
            const row=rows.find(r=>r.name===columns[i]);
            const nullable=table==='pacman_cycle_checkpoints'&&(columns[i]==='operation_id'||columns[i]==='sha');
            if(!row||row.type?.toUpperCase()!==types[i]||
               (i===0&&row.pk!==1)||(!nullable&&row.notnull!==1))
             throw Error('PACMAN_STAGING_D1_SCHEMA_MISMATCH');
           }
          }
          console.log('PACMAN_EXECUTION_READONLY_PREFLIGHT_VERIFIED');
          NODE
      - name: Deploy dedicated staging Worker
        id: deploy
        working-directory: tools/motorlab-pacman
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.pacman-execution-staging.jsonc --keep-vars 2>&1 | tee "$RUNNER_TEMP/pacman-wrangler-deploy.log"
          worker_url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/pacman-wrangler-deploy.log" | head -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "::error::Deployment completed but Wrangler did not report a workers.dev URL; health readback is unverified."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Verify deployed Worker and isolated D1 binding
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          EXECUTION_KEY: ${{ secrets.PACMAN_EXECUTION_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.WORKER_URL;
          if(!base || !/^https:\/\/[a-zA-Z0-9.-]+\.workers\.dev$/.test(base)) throw Error('INVALID_STAGING_WORKER_URL');
          const r=await fetch(base+'/health',{redirect:'error',signal:AbortSignal.timeout(15000)});
          const body=await r.json();
          if(!r.ok || body.service!=='pacman-execution-staging' || body.database!=='CONNECTED')
            throw Error('STAGING_HEALTH_READBACK_FAILED');
          console.log('PACMAN_STAGING_WORKER_HEALTH_AND_D1_BINDING_VERIFIED');
          if(body.revision!=='pacman-v2-webauthn-relay-20261016')
            throw Error('EXECUTION_REVISION_UNEXPECTED');
          const diagnostic=base+'/__motorlab_lab/diagnostics/execution-readiness';
          const untrusted=await fetch(diagnostic,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(15000)});
          if(untrusted.status!==401)throw Error('EXECUTION_READINESS_MUST_REQUIRE_AUTH');
          if(typeof process.env.EXECUTION_KEY!=='string'||process.env.EXECUTION_KEY.length<32)
           throw Error('EXECUTION_READBACK_KEY_UNAVAILABLE');
          const authorized=await fetch(diagnostic,{
           method:'GET',headers:{authorization:'Bearer '+process.env.EXECUTION_KEY},
           redirect:'manual',signal:AbortSignal.timeout(15000)
          });
          let ready;try{ready=await authorized.json();}catch{throw Error('EXECUTION_READINESS_RESPONSE_INVALID');}
          // This initial safety deployment MUST remain disabled until issuer proof is verified.
          if(authorized.status!==503||ready.error!=='STAGING_CYCLE_ROUTE_DISABLED')
           throw Error('EXECUTION_CYCLE_SAFETY_GATE_NOT_CLOSED');
          console.log('PACMAN_EXECUTION_DIAGNOSTICS_STAGING_READY_ROUTE_STILL_CLOSED');

          NODE
