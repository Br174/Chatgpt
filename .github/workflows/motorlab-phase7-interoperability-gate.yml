name: MotorLab Phase7 Independent Adapters and Skill Export
on:
  push:
    branches: ['motorlab-phase7-*']
  pull_request:
    branches: [main]
    paths:
      - 'templates/interop/**'
      - 'tools/motorlab_skill_export.py'
      - 'tests/motorlab-phase7-portable-adapters.test.mjs'
      - '.github/workflows/motorlab-phase7-interoperability-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Node and Python adapter parity, fail-closed behavior and Skill ZIP integrity
        run: node --test tests/motorlab-phase7-portable-adapters.test.mjs
      - name: Export a separate optional Skill Creator ZIP
        if: success()
        run: python3 tools/motorlab_skill_export.py --root . --out dist/MotorLab-Skill-Export-r36.zip
      - name: Publish optional skill ZIP as private prerelease asset (not a CORE release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/motorlab-phase7-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/MotorLab-Skill-Export-r36.zip
          TAG="motorlab-optional-skill-r36-${GITHUB_SHA:0:8}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MotorLab-Skill-Export-r36.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/MotorLab-Skill-Export-r36.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "MotorLab optional Skill Creator export — r36" \
              --notes "Optional read-only CORE reference generated from approved allowlist and SHA256 manifest. NOT a CORE release; no native project modification, no external AI provider, no automatic Skill Creator installation."
          fi
          sha256sum dist/MotorLab-Skill-Export-r36.zip
          echo "MOTORLAB_OPTIONAL_SKILL_PRERELEASE=$TAG" >> "$GITHUB_STEP_SUMMARY"

