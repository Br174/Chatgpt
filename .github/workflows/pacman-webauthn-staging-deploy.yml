name: Pac-Man WebAuthn staging deploy (zero-cost, fail-closed)

on:
  push:
    branches:
      - motorlab/pacman-execution-v2-lab-20261014
    paths:
      - '.github/workflows/pacman-webauthn-staging-deploy.yml'
      - 'tools/motorlab-pacman/webauthn/**'
      - 'tools/motorlab-pacman/candidates/webauthn-*.mjs'
      - 'tools/motorlab-pacman/candidates/webauthn-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacman-webauthn-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Br174/Chatgpt' && github.ref == 'refs/heads/motorlab/pacman-execution-v2-lab-20261014'
    runs-on: ubuntu-latest
    environment: pacman-execution-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact isolated WebAuthn staging target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('tools/motorlab-pacman/webauthn/wrangler.pacman-webauthn-staging.jsonc','utf8'));
          if(c.workers_dev!==true ||
             c.name!=='motorlab-pacman-webauthn-staging-lab' ||
             c.main!=='./worker.mjs' ||
             c.d1_databases?.length!==1 ||
             c.d1_databases[0].binding!=='DB' ||
             c.d1_databases[0].database_name!=='motorlab-pacman-staging' ||
             c.d1_databases[0].database_id!=='eb834fc1-5589-4f75-bcb9-d311d0d72261')
            throw Error('WEBAUTHN_STAGING_SCOPE_MISMATCH');
          console.log('WEBAUTHN_STAGING_SCOPE_VERIFIED');
          NODE

      - name: Run complete Pac-Man LAB tests
        run: |
          node --test tools/motorlab-pacman/*.test.mjs
          node --test tools/motorlab-pacman/candidates/*.test.mjs

      - name: Require exact Cloudflare staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::PACMAN_CF_API_TOKEN missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "b86f445c2b57e604c02f79c8da64bb9c" || { echo "::error::Wrong Cloudflare account"; exit 1; }

      - name: Preflight existing Worker remains disabled
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account='b86f445c2b57e604c02f79c8da64bb9c';
          const worker='motorlab-pacman-webauthn-staging-lab';
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'+worker+'/settings';
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(r.status===404){console.log('WEBAUTHN_WORKER: NEW_TARGET');process.exit(0);}
          if(!r.ok)throw Error('WEBAUTHN_PREFLIGHT_HTTP_'+r.status);
          const j=await r.json();
          if(j.success!==true||!Array.isArray(j.result?.bindings))throw Error('WEBAUTHN_PREFLIGHT_INVALID');
          if(j.result.bindings.some(x=>x.name==='PACMAN_WEBAUTHN_ENABLED'))
            throw Error('WEBAUTHN_ALREADY_ACTIVATED_ABORT');
          console.log('WEBAUTHN_EXISTING_TARGET_DISABLED');
          NODE

      - name: Deploy disabled zero-cost WebAuthn staging Worker
        id: deploy
        working-directory: tools/motorlab-pacman/webauthn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.pacman-webauthn-staging.jsonc 2>&1 | tee "$RUNNER_TEMP/pacman-webauthn-deploy.log"
          worker_url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/pacman-webauthn-deploy.log" | head -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "::error::Wrangler did not report a workers.dev URL"
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Worker is still fail-closed
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.WORKER_URL;
          if(!/^https:\/\/[a-zA-Z0-9.-]+\.workers\.dev$/.test(base||''))throw Error('INVALID_WEBAUTHN_WORKER_URL');
          const r=await fetch(base+'/health',{redirect:'error',signal:AbortSignal.timeout(15000)});
          const body=await r.json();
          if(r.status!==503 ||
             body.service!=='motorlab-pacman-webauthn-staging-lab' ||
             body.configured!==false ||
             body.path!=='WEBAUTHN_ZERO_COST')
            throw Error('WEBAUTHN_WORKER_NOT_FAIL_CLOSED');
          console.log('WEBAUTHN_STAGING_DEPLOYED_DISABLED_AND_VERIFIED');
          NODE
