name: Pacman Steel Guard LAB audit tests
on:
  push:
    branches:
      - motorlab/pacman-steel-guard-lab-20261014
    paths:
      - 'tools/motorlab-pacman/steel-guard.mjs'
      - 'tools/motorlab-pacman/steel-guard.test.mjs'
      - '.github/workflows/pacman-steel-guard-lab.yml'
  pull_request:
    paths:
      - 'tools/motorlab-pacman/steel-guard.mjs'
      - 'tools/motorlab-pacman/steel-guard.test.mjs'
      - '.github/workflows/pacman-steel-guard-lab.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/motorlab-pacman/steel-guard.test.mjs
