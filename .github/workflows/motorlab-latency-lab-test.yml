name: MotorLab Latency LAB Test
on:
  push:
    branches:
      - lab/motorlab-latency-branch-r24
jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/motorlab-execution-fabric.test.mjs
