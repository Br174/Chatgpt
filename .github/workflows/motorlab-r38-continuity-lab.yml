name: MotorLab R38 Continuity Pillar LAB
on:
  push:
    branches:
      - motorlab/continuity-pillar-v3-lab-20261016
    paths:
      - 'templates/execution/motorlab-*-lab.mjs'
      - '.github/workflows/motorlab-r38-continuity-lab.yml'
      - 'tests/motorlab-r38-core-integration.test.mjs'
      - 'templates/execution/motorlab-r38-operation-entrypoint-lab.mjs'
      - 'templates/execution/motorlab-r38-operation-entrypoint-lab.test.mjs'
      - 'MOTORLAB_RELEASE_MANIFEST_V1.txt'
      - 'MOTORLAB_CORE_ENTRYPOINT_V1.txt'
  pull_request:
    paths:
      - 'templates/execution/motorlab-*-lab.mjs'
      - '.github/workflows/motorlab-r38-continuity-lab.yml'
      - 'tests/motorlab-r38-core-integration.test.mjs'
      - 'templates/execution/motorlab-r38-operation-entrypoint-lab.mjs'
      - 'templates/execution/motorlab-r38-operation-entrypoint-lab.test.mjs'
      - 'MOTORLAB_RELEASE_MANIFEST_V1.txt'
      - 'MOTORLAB_CORE_ENTRYPOINT_V1.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test continuity decisions and checkpoint handoff
        run: node --test templates/execution/motorlab-continuity-*.test.mjs templates/execution/motorlab-r38-execution-bridge-lab.test.mjs tests/motorlab-r38-core-integration.test.mjs templates/execution/motorlab-r38-operation-entrypoint-lab.test.mjs
