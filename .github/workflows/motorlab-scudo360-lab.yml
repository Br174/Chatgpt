name: MotorLab Scudo360 Regression LAB Gate
on:
  push:
    branches:
      - motorlab/scudo360-regression-lab-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scudo360:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed regression tests, including deliberate failures
        run: node --test tests/motorlab-scudo360-gate.test.mjs
      - name: Preserve Behavior Memory and Compatibility Guard
        run: node --test tests/motorlab-behavior-memory.test.mjs tests/motorlab-behavior-preflight.test.mjs tests/motorlab-r35-verified-supersession.test.mjs
