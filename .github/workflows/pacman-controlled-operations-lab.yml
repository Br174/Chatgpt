name: Pac-Man Controlled GitHub Operations LAB
on:
  push:
    branches:
      - motorlab/pacman-real-operations-lab-20261017
    paths:
      - 'tools/motorlab-pacman/**'
      - '.github/workflows/pacman-controlled-operations-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete original MotorLab Pac-Man suite plus new controlled-operations tests
        run: node --test tools/motorlab-pacman/test-pacman-core.mjs tools/motorlab-pacman/*.test.mjs tools/motorlab-pacman/candidates/*.test.mjs tools/motorlab-pacman/tests/*.test.mjs
      - name: Original Workers runtime regression without deployment
        run: |
          npm install --prefix "$RUNNER_TEMP/pacman-worker-runtime" --no-save --package-lock=false miniflare@4.20260730.0
          PACMAN_MINIFLARE_MODULE="$RUNNER_TEMP/pacman-worker-runtime/node_modules/miniflare" node tools/motorlab-pacman/ci-worker-binding-runtime.mjs
