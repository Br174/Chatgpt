name: Pac-Man staging runtime secret provisioning (manual protected)

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type PROVISION_STAGING_ONLY after reviewing the exact target and source secrets'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pacman-staging-runtime-secret-provision
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'Br174/Chatgpt' && github.ref == 'refs/heads/motorlab/pacman-execution-v2-lab-20261014' && inputs.confirm_staging_only == 'PROVISION_STAGING_ONLY'
    runs-on: ubuntu-latest
    environment: pacman-execution-staging
    timeout-minutes: 10
    steps:
      - name: Verify exact scope and secret sources without disclosing values
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
          EXEC_KEY: ${{ secrets.PACMAN_EXECUTION_KEY }}
          GITHUB_TOKEN_RUNTIME: ${{ secrets.PACMAN_GITHUB_TOKEN }}
          APPROVAL_SECRET: ${{ secrets.PACMAN_APPROVAL_SIGNING_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const expected='b86f445c2b57e604c02f79c8da64bb9c';
          const secrets=[
            ['PACMAN_EXECUTION_KEY',process.env.EXEC_KEY,32],
            ['PACMAN_GITHUB_TOKEN',process.env.GITHUB_TOKEN_RUNTIME,20],
            ['PACMAN_APPROVAL_SIGNING_SECRET',process.env.APPROVAL_SECRET,32]
          ];
          let valid=process.env.CF_ACCOUNT===expected && !!process.env.CF_TOKEN;
          console.log('STAGING_DEPLOY_ACCESS: '+(valid?'CONFIGURED':'MISSING_OR_WRONG_ACCOUNT'));
          for(const [name,value,min] of secrets){
            const ok=typeof value==='string' && value.length>=min;
            console.log(name+'_SOURCE: '+(ok?'CONFIGURED':'MISSING_OR_TOO_SHORT'));
            valid &&=ok;
          }
          if(!valid){console.error('PRECHECK_FAILED_NO_CHANGES');process.exitCode=1;}
          else console.log('PRECHECK_PASSED_STAGING_ONLY');
          NODE
      - name: Upload runtime secrets to exact staging execution Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PACMAN_CF_ACCOUNT_ID }}
          PACMAN_EXECUTION_KEY: ${{ secrets.PACMAN_EXECUTION_KEY }}
          PACMAN_GITHUB_TOKEN: ${{ secrets.PACMAN_GITHUB_TOKEN }}
          PACMAN_APPROVAL_SIGNING_SECRET: ${{ secrets.PACMAN_APPROVAL_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "b86f445c2b57e604c02f79c8da64bb9c"
          printf '%s' "$PACMAN_EXECUTION_KEY" | npx --yes wrangler@4 secret put PACMAN_EXECUTION_KEY --name motorlab-pacman-execution-staging-lab >/dev/null
          printf '%s' "$PACMAN_GITHUB_TOKEN" | npx --yes wrangler@4 secret put PACMAN_GITHUB_TOKEN --name motorlab-pacman-execution-staging-lab >/dev/null
          printf '%s' "$PACMAN_APPROVAL_SIGNING_SECRET" | npx --yes wrangler@4 secret put PACMAN_APPROVAL_SIGNING_SECRET --name motorlab-pacman-execution-staging-lab >/dev/null
          echo 'STAGING_RUNTIME_SECRETS_UPLOAD_COMPLETED_VALUES_NOT_LOGGED'
      - name: Read back secret names and isolated D1 binding
        env:
          CF_TOKEN: ${{ secrets.PACMAN_CF_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/b86f445c2b57e604c02f79c8da64bb9c/workers/scripts/motorlab-pacman-execution-staging-lab/settings';
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('READBACK_HTTP_'+r.status);
          const j=await r.json();
          const b=j.result?.bindings;
          if(j.success!==true || !Array.isArray(b))throw Error('READBACK_INVALID');
          for(const name of ['PACMAN_EXECUTION_KEY','PACMAN_GITHUB_TOKEN','PACMAN_APPROVAL_SIGNING_SECRET']){
            if(!b.some(x=>x.name===name && x.type==='secret_text'))throw Error('SECRET_NOT_CONFIRMED_'+name);
          }
          if(!b.some(x=>x.name==='DB' && x.type==='d1' && x.id==='eb834fc1-5589-4f75-bcb9-d311d0d72261'))throw Error('D1_BINDING_MISMATCH');
          console.log('STAGING_SECRET_NAMES_AND_D1_VERIFIED_NO_VALUES');
          NODE
