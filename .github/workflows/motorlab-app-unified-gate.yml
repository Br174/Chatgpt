name: MotorLab Unified Main App Android11 Integration Gate
on:
  push:
    branches: ['motorlab/app-lab05-unified-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motorlab-lab04-runtime-validation
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify unified main-app package and offline archive contracts
        run: python3 apps/motorlab-android/tests/verify_lab01.py
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -r | head -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and record first testable artifact time
        run: |
          set -euo pipefail
          start="$(date +%s)"
          gradle --no-daemon --build-cache -p apps/motorlab-android :app:assembleDebug
          end="$(date +%s)"
          apk=apps/motorlab-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -m1 "package: name='it.motorlab.app' versionCode='5'"
          echo "MOTORLAB_UNIFIED_APK_BUILD_SECONDS=$((end-start))"
          echo "MOTORLAB_UNIFIED_APK_FIRST_TESTABLE_ARTIFACT=VERIFIED"
          echo "Unified test-only build step: $((end-start)) seconds; runner is GitHub ubuntu-latest, warm Gradle cache may affect repeat runs." >> "$GITHUB_STEP_SUMMARY"
      - name: Audit LAB01 original signing identity (read only, no release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/motorlab-original-lab01"
          mkdir -p "$base"
          if ! gh release download motorlab-app-lab01-test-7b44048 \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'MotorLab-LAB01.apk' --dir "$base"; then
            echo "MOTORLAB_LAB01_CERT_COMPARISON=UNKNOWN_BASELINE_UNAVAILABLE"
            echo "Original LAB01 APK not readable: stable update certification remains blocked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          original="$base/MotorLab-LAB01.apk"
          current="apps/motorlab-android/app/build/outputs/apk/debug/app-debug.apk"
          "$apksigner" verify "$original"
          "$apksigner" verify "$current"
          old_cert="$("$apksigner" verify --print-certs "$original" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          new_cert="$("$apksigner" verify --print-certs "$current" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$old_cert" && test -n "$new_cert"
          if [[ "$old_cert" == "$new_cert" ]]; then
            echo "MOTORLAB_LAB01_DEBUG_CERT_MATCH=YES_ONLY_TEST_CERT"
            echo "LAB01 signature matches this temporary debug APK; physical-device and stable-production signing are still unverified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MOTORLAB_LAB01_DEBUG_CERT_MATCH=NO_UPDATE_IN_PLACE_BLOCKED"
            echo "LAB01 APK and current temporary debug APK have different signing identities. Do NOT install the latter as a direct update over LAB01." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify Android emulator KVM acceleration on runner
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "MOTORLAB_UNIFIED_EMULATOR_INFRA_BLOCKED=no_KVM_character_device"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "MOTORLAB_UNIFIED_EMULATOR_INFRA_BLOCKED=KVM_not_accessible"
            exit 1
          fi
          echo "MOTORLAB_UNIFIED_RUNNER_KVM_ACCELERATION=ENABLED"
      - name: Emulator API 30 canonical app Team Chat navigation, archive, filter and persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: false
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r apps/motorlab-android/app/build/outputs/apk/debug/app-debug.apk
            python3 apps/motorlab-android/tests/emulator_smoke.py
      - name: Record gate outcome without publishing altered APK
        if: success()
        run: |
          echo "MOTORLAB_UNIFIED_ANDROID_RUNTIME_AND_BUILD_GATE=PASSED"
          echo "Emulator API 30 smoke PASSED. This DOES NOT certify stable update signing, preservation of LAB01 data, LAB02/LAB04 migration or acceptance on a physical device." >> "$GITHUB_STEP_SUMMARY"

  autosetup_provider_readback:
    if: github.ref_name == 'motorlab/app-lab05-unified-autosetup-20261013'
    name: AutoSetup GitHub provider read-back (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Check provider comparison logic locally
        run: python3 apps/motorlab-android/tests/verify_github_provider_readback.py --self-test
      - name: Verify remote GitHub branch and PR agree with this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 apps/motorlab-android/tests/verify_github_provider_readback.py
